<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointments</title>

    <style>
        :root {
            --background: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dbe2ea;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --tab-background: #eef2f7;
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        body.dark {
            --background: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --tab-background: #0f172a;
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--background);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
        }

        .theme-toggle button {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--card);
            color: var(--text);
            box-shadow: var(--shadow);
            font-size: 18px;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 620px;
            padding: 40px;
            border-radius: 20px;
            background: var(--card);
            box-shadow: var(--shadow);
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            font-size: 2rem;
        }

        .subtitle {
            margin-bottom: 30px;
            text-align: center;
            color: var(--muted);
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 24px;
            padding: 5px;
            border-radius: 12px;
            background: var(--tab-background);
        }

        .tab-button {
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-button.active {
            background: var(--card);
            color: var(--primary);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .appointment {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .appointment:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .appointment:last-child {
            margin-bottom: 0;
        }

        .appointment-info {
            min-width: 0;
        }

        .doctor {
            margin-bottom: 6px;
            font-size: 17px;
            font-weight: 700;
        }

        .location,
        .date {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .start-button {
            flex-shrink: 0;
            padding: 11px 16px;
            border: none;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .start-button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .past-record {
            align-items: flex-start;
        }

        @media (max-width: 560px) {
            .container {
                padding: 28px 20px;
            }

            .appointment {
                flex-direction: column;
                align-items: stretch;
            }

            .start-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="theme-toggle">
        <button id="themeButton" type="button" aria-label="Toggle dark mode">
            🌙
        </button>
    </div>

    <main class="container">
        <h1>Appointment</h1>
        <p class="subtitle">View and manage your appointments</p>

        <div class="tabs" role="tablist">
            <button
                class="tab-button active"
                type="button"
                data-tab="upcoming"
                role="tab"
                aria-selected="true"
            >
                Upcoming
            </button>

            <button
                class="tab-button"
                type="button"
                data-tab="past"
                role="tab"
                aria-selected="false"
            >
                Past
            </button>
        </div>

        <section id="upcoming" class="tab-content active">
            <article class="appointment">
                <div class="appointment-info">
                    <div class="doctor">Dr Peter Pan</div>
                    <div class="location">Sky Hospital</div>
                </div>

                <button class="start-button" type="button">
                    Start Intake
                </button>
            </article>

            <article class="appointment">
                <div class="appointment-info">
                    <div class="doctor">Dr Stephen King</div>
                    <div class="location">Healthcare Clinic</div>
                </div>

                <button class="start-button" type="button">
                    Start Intake
                </button>
            </article>
        </section>

        <section id="past" class="tab-content">
            <article class="appointment past-record">
                <div class="appointment-info">
                    <div class="doctor">Dr Alex Sachin</div>
                    <div class="location">Palo Alto Care</div>
                    <div class="date">3:00 PM · July 21, 2026</div>
                </div>
            </article>

            <article class="appointment past-record">
                <div class="appointment-info">
                    <div class="doctor">Dr Lily Blooms</div>
                    <div class="date">11:00 AM · July 24, 2026</div>
                </div>
            </article>
        </section>
    </main>

    <script>
        const themeButton = document.getElementById("themeButton");
        const tabButtons = document.querySelectorAll(".tab-button");
        const tabContents = document.querySelectorAll(".tab-content");
        const intakeButtons = document.querySelectorAll(".start-button");

        // Restore the previously selected theme.
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark");
            themeButton.textContent = "☀️";
        }

        themeButton.addEventListener("click", () => {
            document.body.classList.toggle("dark");

            const isDark = document.body.classList.contains("dark");

            themeButton.textContent = isDark ? "☀️" : "🌙";
            localStorage.setItem("theme", isDark ? "dark" : "light");
        });

        tabButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const selectedTab = button.dataset.tab;

                tabButtons.forEach((tabButton) => {
                    const isSelected = tabButton === button;

                    tabButton.classList.toggle("active", isSelected);
                    tabButton.setAttribute("aria-selected", String(isSelected));
                });

                tabContents.forEach((content) => {
                    content.classList.toggle(
                        "active",
                        content.id === selectedTab
                    );
                });
            });
        });

        intakeButtons.forEach((button) => {
            button.addEventListener("click", () => {
                window.location.href = "http://localhost:8000";
            });
        });
    </script>
</body>
</html>
