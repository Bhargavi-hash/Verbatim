<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Physician Summary · Verbatim</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/appointment-detail.css">
    <link rel="stylesheet" href="../css/doctor.css">
</head>

<body>
    <header class="navbar" data-role="doctor">
        <a class="navbar-brand" href="doctor-dashboard.html">
            <span class="navbar-mark">V</span> Verbatim
        </a>
        <nav class="navbar-links">
            <a class="navbar-link active" href="doctor-dashboard.html">Review Queue</a>
        </nav>
        <div class="navbar-actions">
            <select id="viewLangSelect" class="navbar-select" aria-label="View summary in language">
                <option value="">View in: English</option>
                <option value="Spanish">Español</option>
                <option value="French">Français</option>
                <option value="Portuguese">Português</option>
                <option value="German">Deutsch</option>
                <option value="Mandarin Chinese">中文</option>
                <option value="Arabic">العربية</option>
                <option value="Hindi">हिन्दी</option>
                <option value="Russian">Русский</option>
                <option value="Vietnamese">Tiếng Việt</option>
            </select>
            <span class="navbar-user">
                <span class="avatar" id="doctorInitials"></span>
                <span id="doctorName"></span>
            </span>
            <button id="themeButton" class="theme-btn" type="button" aria-label="Toggle dark mode"></button>
        </div>
    </header>

    <main class="page-content">
        <a class="back-link" href="doctor-dashboard.html"><span id="backIcon" class="icon-inline"></span>Back to review queue</a>
        <div id="body"></div>
    </main>

    <script src="../js/icons.js"></script>
    <script>document.getElementById("backIcon").innerHTML = Icons.chevronLeft(14);</script>
    <script src="../js/theme.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/doctor-review.js"></script>
    <script src="../js/user-menu.js"></script>
</body>
</html>
