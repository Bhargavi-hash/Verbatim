<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointments · Verbatim</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/appointment.css">
</head>

<body>
    <header class="navbar">
        <a class="navbar-brand" href="appointment.html">
            <span class="navbar-mark">V</span> Verbatim
        </a>
        <nav class="navbar-links">
            <a class="navbar-link active" href="appointment.html">Appointments</a>
        </nav>
        <div class="navbar-actions">
            <span class="navbar-user">
                <span class="avatar">MG</span>
                <span>Maria Gonzalez</span>
            </span>
            <button id="themeButton" class="theme-btn" type="button" aria-label="Toggle dark mode">🌙</button>
        </div>
    </header>

    <main class="page-content">
        <div class="page-header">
            <h1>Appointments</h1>
            <p>View upcoming visits, review past intake records, and manage your profile.</p>
        </div>

        <div class="tabs" role="tablist">
            <button
                class="tab-button active"
                type="button"
                data-tab="upcoming"
                role="tab"
                aria-selected="true"
            >
                Upcoming
            </button>

            <button
                class="tab-button"
                type="button"
                data-tab="past"
                role="tab"
                aria-selected="false"
            >
                Past
            </button>

            <button
                class="tab-button"
                type="button"
                data-tab="profile"
                role="tab"
                aria-selected="false"
            >
                Profile
            </button>
        </div>

        <section id="upcoming" class="tab-content active"></section>
        <section id="past" class="tab-content"></section>
        <section id="profile" class="tab-content"></section>
    </main>

    <script src="../js/theme.js"></script>
    <script src="../js/appointments-data.js"></script>
    <script src="../js/appointment.js"></script>
</body>
</html>
