<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbatim Login</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="toggle">
    <button id="themeBtn">🌙</button>
</div>

<div class="card">
    <h1 class="brand-tile"><img src="banner.png" width=250 height=100></img></h1>
    <div class="subtitle" id="subtitle">Please sign in</div>

    <div class="role-toggle" role="tablist">
        <button type="button" class="role-button active" data-role="patient" role="tab" aria-selected="true">Patient</button>
        <button type="button" class="role-button" data-role="doctor" role="tab" aria-selected="false">Doctor</button>
    </div>

    <form id="loginForm">
        <div id="registerFields" style="display:none">
            <label>Full Name</label>
            <input id="name" type="text" placeholder="Enter your full name">

            <label>Preferred Language</label>
            <select id="preferredLanguage">
                <option>English</option>
                <option>Spanish</option>
                <option>French</option>
                <option>Portuguese</option>
                <option>German</option>
                <option>Mandarin Chinese</option>
                <option>Arabic</option>
                <option>Hindi</option>
                <option>Russian</option>
                <option>Japanese</option>
                <option>Korean</option>
                <option>Italian</option>
                <option>Vietnamese</option>
                <option>Tagalog</option>
                <option value="__other__">Other…</option>
            </select>
            <input id="preferredLanguageOther" type="text" placeholder="Enter your language" style="display:none;margin-top:8px">
        </div>

        <label>Email</label>
        <input id="email" type="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password" required>

        <div id="errorMsg" style="display:none;color:#ff3b30;font-size:13px;margin-bottom:14px"></div>

        <button class="login" type="submit" id="submitBtn">
            Sign In
        </button>
    </form>

    <div class="footer">
        <span id="modeToggle" style="cursor:pointer;color:var(--primary)">New here? Create an account</span>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/login.js"></script>

</body>
</html>
